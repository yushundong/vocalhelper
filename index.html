<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声学解剖热力图 — Vocal Anatomy Heatmap v4</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary:#0a0b0f;--bg-secondary:#12141c;--bg-card:#181a24;
    --accent-warm:#ff6b4a;--accent-cool:#4a9eff;--accent-green:#4aff8b;
    --accent-yellow:#ffb84a;--accent-pink:#d4468a;
    --text-primary:#e8e6e3;--text-secondary:#9a98a9;--text-dim:#65637a;
    --border:rgba(255,255,255,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;font-size:15px;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(74,158,255,0.04),transparent),radial-gradient(ellipse 60% 50% at 80% 100%,rgba(255,107,74,0.03),transparent);pointer-events:none;z-index:0;}
  .app{position:relative;z-index:1;}

  header{padding:18px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;background:rgba(10,11,15,0.88);flex-wrap:wrap;gap:10px;}
  .logo{display:flex;align-items:center;gap:12px;}
  .logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent-warm),var(--accent-cool));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 20px rgba(255,107,74,0.2);}
  .logo h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 40%,var(--accent-cool));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo .subtitle{font-size:12px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
  .header-controls{display:flex;align-items:center;gap:10px;}
  .status-badge{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text-secondary);transition:all .3s;}
  .status-badge.active{border-color:rgba(74,255,139,0.3);color:var(--accent-green);background:rgba(74,255,139,0.05);}
  .status-badge.paused{border-color:rgba(255,184,74,0.3);color:var(--accent-yellow);background:rgba(255,184,74,0.05);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);transition:all .3s;}
  .status-badge.active .status-dot{background:var(--accent-green);box-shadow:0 0 8px var(--accent-green);animation:pulse-dot 1.5s infinite;}
  .status-badge.paused .status-dot{background:var(--accent-yellow);box-shadow:0 0 6px var(--accent-yellow);}
  @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 24px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;letter-spacing:.4px;}
  .btn-start{background:linear-gradient(135deg,var(--accent-warm),#ff8f4a);color:#fff;box-shadow:0 4px 20px rgba(255,107,74,0.3);}
  .btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(255,107,74,0.4);}
  .btn-start.recording{background:linear-gradient(135deg,#ff4a4a,var(--accent-warm));animation:btn-pulse 2s infinite;}
  @keyframes btn-pulse{0%,100%{box-shadow:0 4px 20px rgba(255,74,74,0.3)}50%{box-shadow:0 4px 30px rgba(255,74,74,0.5)}}
  .btn-pause{background:rgba(255,184,74,0.12);color:var(--accent-yellow);border:1px solid rgba(255,184,74,0.25);display:none;}
  .btn-pause:hover{background:rgba(255,184,74,0.2);transform:translateY(-1px);}
  .btn-pause.visible{display:flex;}
  .btn-pause.is-paused{background:rgba(74,255,139,0.12);color:var(--accent-green);border-color:rgba(74,255,139,0.25);}
  .btn-pause.is-paused:hover{background:rgba(74,255,139,0.2);}
  .btn svg{width:17px;height:17px;}

  .voice-filter-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);font-size:12px;color:var(--accent-cool);font-family:'JetBrains Mono',monospace;}

  .main-content{display:grid;grid-template-columns:1fr 480px 1fr;gap:0;min-height:calc(100vh - 66px);}
  .panel-left,.panel-right{padding:24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:calc(100vh - 66px);}
  .panel-right{gap:12px;}
  .panel-title{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;font-weight:500;}

  .metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:all .3s;flex-shrink:0;}
  .metric-card:hover{border-color:rgba(255,255,255,0.1);}
  .metric-label{font-size:12px;color:var(--text-secondary);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:500;}
  .metric-label .dot{width:6px;height:6px;border-radius:50%;}
  .metric-value{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:400;letter-spacing:-1px;margin-bottom:4px;}
  .metric-unit{font-size:15px;color:var(--text-secondary);font-weight:300;}
  .metric-bar-container{height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;margin-top:10px;}
  .metric-bar{height:100%;border-radius:2px;transition:width .15s ease-out;width:0%;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;}
  .info-item{background:rgba(255,255,255,0.02);border-radius:8px;padding:10px 12px;border:1px solid var(--border);}
  .info-item-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:500;}
  .info-item-value{font-family:'JetBrains Mono',monospace;font-size:16px;margin-top:3px;}

  .anatomy-container{position:relative;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);border-right:1px solid var(--border);background:radial-gradient(ellipse at 50% 45%,rgba(74,158,255,0.02),transparent 70%);overflow:hidden;}
  .anatomy-svg-wrap{width:460px;height:700px;position:relative;}
  .anatomy-svg-wrap svg{width:100%;height:100%;}
  .anatomy-region{transition:fill .05s linear,filter .05s linear;cursor:pointer;}
  .anatomy-region:hover{filter:brightness(1.3);}
  .heat-legend{display:flex;align-items:center;gap:8px;}
  .heat-gradient-bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#1a1a3e,#2d1b69,#6b2fa0,#d4468a,#ff6b4a,#ffb84a,#fff7a0);}
  .heat-label{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;letter-spacing:1px;}

  .tooltip{position:fixed;padding:12px 16px;background:rgba(24,26,36,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:10px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:200;backdrop-filter:blur(10px);max-width:240px;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
  .tooltip.visible{opacity:1;}
  .tooltip-title{font-weight:600;margin-bottom:4px;color:#fff;font-size:15px;}
  .tooltip-value{font-family:'JetBrains Mono',monospace;color:var(--accent-warm);font-size:16px;}
  .tooltip-desc{color:var(--text-secondary);font-size:13px;margin-top:4px;line-height:1.55;}

  .spectrum-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;flex-shrink:0;}
  .spectrum-canvas{width:100%;height:110px;border-radius:7px;margin-top:10px;}
  .waveform-canvas{width:100%;height:65px;border-radius:7px;margin-top:10px;}

  /* Cumulative cards */
  .cum-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;flex-shrink:0;position:relative;overflow:hidden;}
  .cum-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cum-badge{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);}

  .rank-row{display:flex;align-items:center;gap:8px;font-size:13px;height:22px;}
  .rank-num{width:16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-align:right;flex-shrink:0;}
  .rank-label{flex:1;color:var(--text-secondary);white-space:nowrap;}
  .rank-bar-bg{width:65px;height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;flex-shrink:0;}
  .rank-bar{height:100%;border-radius:2px;transition:width .5s;}
  .rank-pct{width:34px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;flex-shrink:0;}

  .rt-rank-row{display:flex;align-items:center;gap:8px;font-size:13px;height:21px;margin-bottom:3px;}

  .diag-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .diag-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:13px;line-height:1.55;}
  .diag-icon{flex-shrink:0;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;}
  .diag-icon.good{background:rgba(74,255,139,0.12);color:var(--accent-green);}
  .diag-icon.warn{background:rgba(255,184,74,0.12);color:var(--accent-yellow);}
  .diag-icon.issue{background:rgba(255,74,74,0.12);color:#ff6b6b;}
  .diag-text{color:var(--text-secondary);}
  .diag-text strong{color:var(--text-primary);font-weight:500;}

  .realtime-rank-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;flex-shrink:0;}

  .onboard-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,11,15,0.7);backdrop-filter:blur(8px);z-index:50;transition:opacity .5s;}
  .onboard-overlay.hidden{opacity:0;pointer-events:none;}
  .onboard-text{font-size:16px;color:var(--text-secondary);margin-bottom:20px;text-align:center;line-height:1.8;}
  .onboard-text strong{color:#fff;font-weight:600;}
  .mic-icon-big{width:60px;height:60px;border-radius:50%;background:rgba(255,107,74,0.1);border:2px solid rgba(255,107,74,0.2);display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .mic-icon-big svg{width:26px;height:26px;color:var(--accent-warm);}

  /* Pause overlay on anatomy */
  .pause-overlay{position:absolute;inset:0;background:rgba(10,11,15,0.45);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
  .pause-overlay.visible{opacity:1;pointer-events:auto;}
  .pause-overlay-text{font-size:18px;font-weight:600;color:var(--accent-yellow);letter-spacing:1px;padding:12px 28px;border-radius:12px;background:rgba(24,26,36,0.8);border:1px solid rgba(255,184,74,0.2);}

  .panel-right::-webkit-scrollbar,.panel-left::-webkit-scrollbar{width:4px;}
  .panel-right::-webkit-scrollbar-track,.panel-left::-webkit-scrollbar-track{background:transparent;}
  .panel-right::-webkit-scrollbar-thumb,.panel-left::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}

  @media(max-width:1200px){
    .main-content{grid-template-columns:1fr;grid-template-rows:auto auto auto;}
    .anatomy-container{border-left:none;border-right:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);min-height:580px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🎙</div>
      <div><h1>声学解剖热力图</h1><div class="subtitle">声乐诊断与训练</div></div>
    </div>
    <div class="header-controls">
      <div class="voice-filter-badge">🛡 人声过滤</div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">等待启动</span>
      </div>
      <button class="btn btn-pause" id="btnPause" onclick="togglePause()">
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <span id="pauseText">暂停</span>
      </button>
      <button class="btn btn-start" id="btnStart" onclick="toggleRecording()">
        <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span id="btnText">开始分析</span>
      </button>
    </div>
  </header>

  <div class="main-content">
    <!-- Left -->
    <div class="panel-left">
      <div class="panel-title">实时声学参数</div>
      <div class="metric-card">
        <div class="metric-label"><span class="dot" style="background:var(--accent-warm)"></span> 基频 F0</div>
        <div class="metric-value" id="metricF0">—<span class="metric-unit"> Hz</span></div>
        <div class="metric-bar-container"><div class="metric-bar" id="barF0" style="background:linear-gradient(90deg,var(--accent-warm),#ffb84a)"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><span class="dot" style="background:var(--accent-cool)"></span> 响度 SPL</div>
        <div class="metric-value" id="metricSPL">—<span class="metric-unit"> dB</span></div>
        <div class="metric-bar-container"><div class="metric-bar" id="barSPL" style="background:linear-gradient(90deg,var(--accent-cool),#4affce)"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><span class="dot" style="background:var(--accent-green)"></span> 声道共鸣</div>
        <div class="metric-value" id="metricResonance">—<span class="metric-unit"> %</span></div>
        <div class="metric-bar-container"><div class="metric-bar" id="barResonance" style="background:linear-gradient(90deg,var(--accent-green),#a0ff4a)"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><span class="dot" style="background:var(--accent-pink)"></span> 气息流量</div>
        <div class="metric-value" id="metricAirflow">—<span class="metric-unit"> %</span></div>
        <div class="metric-bar-container"><div class="metric-bar" id="barAirflow" style="background:linear-gradient(90deg,#d4468a,#ff6baa)"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label"><span class="dot" style="background:var(--accent-yellow)"></span> 共振峰分布</div>
        <div class="info-grid">
          <div class="info-item"><div class="info-item-label">F1</div><div class="info-item-value" id="f1Val" style="color:#ffb84a">— Hz</div></div>
          <div class="info-item"><div class="info-item-label">F2</div><div class="info-item-value" id="f2Val" style="color:#ff8f4a">— Hz</div></div>
          <div class="info-item"><div class="info-item-label">F3</div><div class="info-item-value" id="f3Val" style="color:#d4468a">— Hz</div></div>
          <div class="info-item"><div class="info-item-label">F4</div><div class="info-item-value" id="f4Val" style="color:#a04aff">— Hz</div></div>
        </div>
      </div>
      <div class="realtime-rank-card">
        <div class="metric-label"><span class="dot" style="background:#ff6b4a"></span> 实时参与度 <span style="font-size:11px;color:var(--text-dim);margin-left:auto;">2 Hz</span></div>
        <div id="realtimeRanking" style="margin-top:8px;"><div style="color:var(--text-dim);font-size:14px;font-style:italic;">等待声音输入...</div></div>
      </div>
    </div>

    <!-- Center -->
    <div class="anatomy-container">
      <div class="onboard-overlay" id="onboardOverlay">
        <div class="mic-icon-big">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
        <div class="onboard-text">点击右上角 <strong>「开始分析」</strong> 按钮<br>授权麦克风后发声即可看到实时热力图<br><span style="font-size:14px;color:var(--text-dim);margin-top:8px;display:inline-block;">🛡 人声过滤 · 声乐诊断</span></div>
      </div>
      <div class="pause-overlay" id="pauseOverlay"><div class="pause-overlay-text">⏸ 已暂停分析</div></div>
      <div class="anatomy-svg-wrap">
        <svg viewBox="0 0 480 700" xmlns="http://www.w3.org/2000/svg" id="anatomySvg">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glowStrong"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <linearGradient id="bodyOutline" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,0.15)"/><stop offset="100%" stop-color="rgba(255,255,255,0.05)"/></linearGradient>
          </defs>
          <g opacity="0.04" stroke="#fff" stroke-width="0.5"><line x1="240" y1="0" x2="240" y2="700"/><line x1="0" y1="175" x2="480" y2="175"/><line x1="0" y1="350" x2="480" y2="350"/><line x1="0" y1="525" x2="480" y2="525"/></g>
          <g id="bodyOutlineGroup">
            <path d="M200,28 C200,28 168,33 155,68 C142,103 140,138 145,163 C148,178 155,188 165,193 L165,208 C155,213 148,223 145,238 C142,253 140,268 145,283 L145,288 C140,293 138,303 140,313 C142,323 150,328 160,328 L165,328 L170,348 C172,358 178,373 190,388 L200,398" fill="none" stroke="url(#bodyOutline)" stroke-width="1.5"/>
            <path d="M310,28 C310,28 342,33 350,73 C358,113 355,143 345,168 C340,180 335,186 330,190 L328,198 C332,208 335,223 333,243 C331,258 328,273 325,283 L323,293 C328,298 330,308 330,318 C330,328 325,333 318,333 L310,333 L305,353 C302,368 296,383 288,398 L280,408" fill="none" stroke="url(#bodyOutline)" stroke-width="1.5"/>
            <path d="M200,398 C190,418 175,448 165,488 C155,528 150,558 150,588 L150,700" fill="none" stroke="url(#bodyOutline)" stroke-width="1.5"/>
            <path d="M280,408 C290,428 305,458 315,498 C325,538 330,568 330,598 L330,700" fill="none" stroke="url(#bodyOutline)" stroke-width="1.5"/>
          </g>
          <path class="anatomy-region" id="region-head" d="M200,43 C200,43 185,48 178,68 C172,86 175,108 185,118 C195,128 215,133 240,128 C265,123 285,118 295,106 C305,94 308,76 302,60 C296,44 280,38 270,36 C260,34 240,36 225,38 Z" fill="#1a1a3e" data-name="头腔共鸣区" data-desc="高频共振区域，影响声音的明亮度和穿透力" filter="url(#glow)"/>
          <path class="anatomy-region" id="region-nasal" d="M205,128 C205,128 198,138 195,153 C192,168 195,183 200,188 C205,193 220,198 240,196 C260,194 272,188 276,180 C280,172 282,156 278,143 C274,130 265,126 250,125 C235,124 215,125 205,128 Z" fill="#1a1a3e" data-name="鼻腔共鸣" data-desc="鼻腔共振增强中高频泛音" filter="url(#glow)"/>
          <path class="anatomy-region" id="region-oral" d="M190,193 C190,193 185,208 183,228 C181,248 185,266 195,273 C205,280 225,283 245,281 C265,279 280,273 288,263 C296,253 298,233 295,216 C292,199 285,193 275,190 C265,187 245,188 230,189 C215,190 200,191 190,193 Z" fill="#1a1a3e" data-name="口腔共鸣" data-desc="主要共鸣腔体，舌位和唇形塑造元音" filter="url(#glow)"/>
          <path class="anatomy-region" id="region-softpalate" d="M255,193 C255,193 268,198 278,213 C288,228 290,238 285,248 C280,258 270,263 260,256 C250,249 248,233 250,218 C252,203 255,193 255,193 Z" fill="#1a1a3e" data-name="软腭" data-desc="控制鼻腔与口腔气流分配" filter="url(#glow)"/>

<script>
let audioCtx, analyser, analyserWave, source, stream;
let isRecording=false, isPaused=false;
let dataArray, waveDataArray, freqBinCount, animFrameId;

const regions={
  'region-head':{label:'头腔共鸣区',freqs:[[3000,5000,0.6],[5000,8000,0.9],[8000,12000,0.5]],weight:0.8},
  'region-nasal':{label:'鼻腔共鸣',freqs:[[2000,3000,0.7],[3000,4500,1.0],[250,450,0.4]],weight:0.9},
  'region-oral':{label:'口腔共鸣',freqs:[[500,1500,0.8],[1500,3000,1.0],[300,500,0.4]],weight:1.0},
  'region-softpalate':{label:'软腭',freqs:[[1500,2500,0.8],[2500,3500,0.6]],weight:0.65},
  'region-tongue':{label:'舌根与舌体',freqs:[[800,1800,1.0],[1800,2500,0.7]],weight:0.8},
  'region-pharynx':{label:'咽腔',freqs:[[300,800,0.9],[800,1500,0.7]],weight:0.9},
  'region-epiglottis':{label:'会厌',freqs:[[400,800,0.6],[800,1200,0.5]],weight:0.45},
  'region-vocalcords':{label:'声带',freqs:[[80,300,1.0],[300,600,0.7],[600,1000,0.3]],weight:1.3},
  'region-thyroid':{label:'甲状软骨',freqs:[[100,400,0.7],[400,800,0.4]],weight:0.55},
  'region-cricothyroid':{label:'环甲肌',freqs:[[150,350,0.5],[350,600,0.8]],weight:0.7},
  'region-trachea':{label:'气管',freqs:[[60,200,0.7],[200,400,0.5]],weight:0.6},
  'region-chest':{label:'胸腔共鸣',freqs:[[50,150,1.0],[150,250,0.6]],weight:0.95},
  'region-diaphragm':{label:'膈肌',freqs:[[20,80,0.7],[80,150,0.5]],weight:0.75},
  'region-dantian':{label:'丹田',freqs:[[20,60,0.8],[60,120,0.6]],weight:0.7},
};
const regionIds=Object.keys(regions);

function intensityToColor(t){
  t=Math.max(0,Math.min(1,t));
  const s=[[26,26,62],[45,27,105],[107,47,160],[212,70,138],[255,107,74],[255,184,74],[255,247,160]];
  const p=[0,0.15,0.3,0.45,0.62,0.8,1.0];
  let i=0;for(;i<p.length-1;i++)if(t<=p[i+1])break;
  const lt=(t-p[i])/(p[i+1]-p[i]),c0=s[i],c1=s[Math.min(i+1,s.length-1)];
  return`rgb(${Math.round(c0[0]+(c1[0]-c0[0])*lt)},${Math.round(c0[1]+(c1[1]-c0[1])*lt)},${Math.round(c0[2]+(c1[2]-c0[2])*lt)})`;
}

function getMultiBandEnergy(da,sr,fs,bands){
  const bs=sr/fs;let tot=0,wt=0;
  for(const[lo,hi,w]of bands){const l=Math.max(1,Math.floor(lo/bs)),h=Math.min(da.length-1,Math.ceil(hi/bs));if(l>=h)continue;let s=0,c=0;for(let i=l;i<=h;i++){s+=da[i];c++;}tot+=(c>0?s/c/255:0)*w;wt+=w;}
  return wt>0?tot/wt:0;
}

// Relaxed voice detection
function isVoice(da,wd,sr,fs){
  let rms=0;for(let i=0;i<wd.length;i++){const v=(wd[i]-128)/128;rms+=v*v;}
  rms=Math.sqrt(rms/wd.length);
  if(rms<0.01) return false; // lowered from 0.018

  const bs=sr/fs;
  let wS=0,tA=0;
  for(let i=1;i<da.length;i++){wS+=da[i]*i*bs;tA+=da[i];}
  const centroid=tA>0?wS/tA:0;
  if(centroid<100||centroid>6000) return false; // wider range

  // Voice band ratio — relaxed
  const vLo=Math.floor(80/bs),vHi=Math.ceil(5000/bs);
  let vE=0,aE=0;
  for(let i=1;i<da.length;i++){aE+=da[i];if(i>=vLo&&i<=vHi)vE+=da[i];}
  if(aE>0&&vE/aE<0.4) return false; // lowered from 0.55

  return true; // removed strict F0 requirement
}

function estimateF0(wd,sr){
  const S=wd.length,buf=new Float32Array(S);
  for(let i=0;i<S;i++)buf[i]=(wd[i]-128)/128;
  let rms=0;for(let i=0;i<S;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/S);
  if(rms<0.008)return 0;
  const mnL=Math.floor(sr/600),mxL=Math.min(Math.floor(sr/60),Math.floor(S/2));
  let bC=-1,bL=-1;
  for(let lag=mnL;lag<mxL;lag++){let c=0;for(let i=0;i<S-lag;i++)c+=buf[i]*buf[i+lag];c/=(S-lag);if(c>bC){bC=c;bL=lag;}}
  return bL>0&&bC>0.005?sr/bL:0;
}

function findFormants(da,sr,fs){
  const bs=sr/fs,sm=new Float32Array(da.length);
  for(let i=3;i<da.length-3;i++)sm[i]=(da[i-3]+da[i-2]*2+da[i-1]*3+da[i]*4+da[i+1]*3+da[i+2]*2+da[i+3])/18;
  const f=[];const lo=Math.floor(200/bs),hi=Math.min(sm.length-2,Math.ceil(5500/bs));
  for(let i=lo+1;i<hi;i++)if(sm[i]>sm[i-1]&&sm[i]>sm[i+1]&&sm[i]>25)f.push({freq:Math.round(i*bs),amp:sm[i]});
  f.sort((a,b)=>b.amp-a.amp);return f.slice(0,6);
}

// ── Cumulative state ──
const cumIntensities={};
regionIds.forEach(id=>cumIntensities[id]=0);
let cumSampleCount=0, cumStartTime=0;
const CUM_DECAY=0.9988; // ~3min half-life at 60fps
let cumF0Sum=0, cumF0Count=0;

// ── Diagnosis ──
function diagnose(){
  const cum=cumIntensities;
  let mx=0.001;regionIds.forEach(id=>{if(cum[id]>mx)mx=cum[id];});
  const n={};regionIds.forEach(id=>n[id]=cum[id]/mx);
  const tips=[];
  const avgF0=cumF0Count>0?cumF0Sum/cumF0Count:0;

  if(n['region-vocalcords']>0.85) tips.push({type:'good',text:'<strong>声带</strong>参与度高，发声基础扎实'});
  else if(n['region-vocalcords']<0.4&&cumSampleCount>50) tips.push({type:'issue',text:'<strong>声带</strong>参与不足，注意喉部放松并集中气息'});

  if(n['region-head']>0.6) tips.push({type:'good',text:'<strong>头腔共鸣</strong>充分，声音穿透力好'});
  else if(n['region-head']<0.2&&cumSampleCount>50) tips.push({type:'warn',text:'<strong>头腔共鸣</strong>偏弱，尝试"哼鸣"练习打开高位共鸣'});

  if(n['region-nasal']>0.75) tips.push({type:'warn',text:'<strong>鼻腔</strong>参与过高，鼻音偏重，注意软腭上提'});
  else if(n['region-nasal']>0.35&&n['region-nasal']<0.65) tips.push({type:'good',text:'<strong>鼻腔</strong>共鸣适度，音色平衡自然'});

  if(n['region-oral']>0.7) tips.push({type:'good',text:'<strong>口腔</strong>共鸣充分，咬字和元音塑造良好'});
  else if(n['region-oral']<0.3&&cumSampleCount>50) tips.push({type:'issue',text:'<strong>口腔</strong>共鸣不足，试着张大嘴巴、放松下颌'});

  if(n['region-pharynx']>0.6&&n['region-oral']>0.5) tips.push({type:'good',text:'<strong>咽腔</strong>与口腔协调，声道通畅'});
  else if(n['region-pharynx']>0.8&&n['region-oral']<0.4) tips.push({type:'warn',text:'<strong>咽腔</strong>偏紧口腔不足，"打哈欠"放松喉咙'});

  if(n['region-chest']>0.6) tips.push({type:'good',text:'<strong>胸腔共鸣</strong>丰富，声音厚实有力'});
  else if(n['region-chest']<0.2&&avgF0<250&&cumSampleCount>50) tips.push({type:'warn',text:'<strong>胸腔共鸣</strong>偏弱，低音区可加强胸声支撑'});

  const bs=(n['region-diaphragm']+n['region-dantian'])/2;
  if(bs>0.55) tips.push({type:'good',text:'<strong>膈肌/丹田</strong>支撑有力，气息稳定'});
  else if(bs<0.25&&cumSampleCount>50) tips.push({type:'issue',text:'<strong>气息支撑</strong>薄弱！练习腹式呼吸，强化丹田发力'});

  if(avgF0>300&&n['region-cricothyroid']<0.3) tips.push({type:'warn',text:'<strong>环甲肌</strong>参与不足，高音注意用"轻机能"拉伸'});
  if(avgF0>250&&n['region-cricothyroid']>0.6) tips.push({type:'good',text:'<strong>环甲肌</strong>积极拉伸，高音控制良好'});

  if(n['region-tongue']>0.8&&n['region-pharynx']>0.7) tips.push({type:'warn',text:'<strong>舌根</strong>紧张偏高，舌尖顶下牙放松舌根'});

  const up=(n['region-head']+n['region-nasal'])/2, lo=(n['region-chest']+n['region-diaphragm']+n['region-dantian'])/3;
  if(Math.abs(up-lo)<0.2&&up>0.3) tips.push({type:'good',text:'上下共鸣<strong>均衡度好</strong>，发声通道通畅'});
  else if(up>lo+0.35) tips.push({type:'warn',text:'偏"头重脚轻"，加强<strong>胸腔与腹部支撑</strong>'});
  else if(lo>up+0.35) tips.push({type:'warn',text:'偏"闷沉"，尝试<strong>打开高位共鸣</strong>增加明亮度'});

  return tips.slice(0,4);
}

// ── Smoothing / state ──
const smoothedI={};regionIds.forEach(k=>smoothedI[k]=0);
let lastRtRank=0, lastCumRender=0, voiceDetected=false, frameCount=0;

// ── Controls ──
async function toggleRecording(){
  if(!isRecording){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const hp=audioCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=55;hp.Q.value=0.7;
      const bp=audioCtx.createBiquadFilter();bp.type='peaking';bp.frequency.value=1000;bp.Q.value=0.5;bp.gain.value=3;
      analyser=audioCtx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0.75;
      analyserWave=audioCtx.createAnalyser();analyserWave.fftSize=4096;
      source=audioCtx.createMediaStreamSource(stream);
      source.connect(hp);hp.connect(bp);bp.connect(analyser);source.connect(analyserWave);
      freqBinCount=analyser.frequencyBinCount;
      dataArray=new Uint8Array(freqBinCount);waveDataArray=new Uint8Array(analyserWave.fftSize);
      isRecording=true;isPaused=false;
      cumStartTime=Date.now();cumSampleCount=0;cumF0Sum=0;cumF0Count=0;
      regionIds.forEach(id=>cumIntensities[id]=0);
      document.getElementById('btnStart').classList.add('recording');
      document.getElementById('btnText').textContent='停止';
      document.getElementById('btnIcon').innerHTML='<rect x="5" y="5" width="14" height="14" rx="2"/>';
      document.getElementById('statusBadge').classList.add('active');
      document.getElementById('statusBadge').classList.remove('paused');
      document.getElementById('statusText').textContent='实时分析中';
      document.getElementById('onboardOverlay').classList.add('hidden');
      document.getElementById('btnPause').classList.add('visible');
      document.getElementById('btnPause').classList.remove('is-paused');
      document.getElementById('pauseOverlay').classList.remove('visible');
      animate();
    }catch(e){alert('无法访问麦克风：'+e.message);}
  } else {
    isRecording=false;isPaused=false;
    if(animFrameId)cancelAnimationFrame(animFrameId);
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(audioCtx)audioCtx.close();
    document.getElementById('btnStart').classList.remove('recording');
    document.getElementById('btnText').textContent='开始分析';
    document.getElementById('btnIcon').innerHTML='<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>';
    document.getElementById('statusBadge').classList.remove('active','paused');
    document.getElementById('statusText').textContent='已停止';
    document.getElementById('btnPause').classList.remove('visible','is-paused');
    document.getElementById('pauseOverlay').classList.remove('visible');
  }
}

function togglePause(){
  if(!isRecording)return;
  isPaused=!isPaused;
  const pb=document.getElementById('btnPause'), sb=document.getElementById('statusBadge');
  if(isPaused){
    pb.classList.add('is-paused');
    document.getElementById('pauseText').textContent='继续';
    document.getElementById('pauseIcon').innerHTML='<polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>';
    sb.classList.remove('active');sb.classList.add('paused');
    document.getElementById('statusText').textContent='已暂停';
    document.getElementById('pauseOverlay').classList.add('visible');
  } else {
    pb.classList.remove('is-paused');
    document.getElementById('pauseText').textContent='暂停';
    document.getElementById('pauseIcon').innerHTML='<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    sb.classList.add('active');sb.classList.remove('paused');
    document.getElementById('statusText').textContent='实时分析中';
    document.getElementById('pauseOverlay').classList.remove('visible');
  }
}

function animate(){
  if(!isRecording)return;
  animFrameId=requestAnimationFrame(animate);
  if(isPaused) return; // skip all processing when paused
  frameCount++;

  analyser.getByteFrequencyData(dataArray);
  analyserWave.getByteTimeDomainData(waveDataArray);
  const sr=audioCtx.sampleRate, fs=analyser.fftSize;
  voiceDetected=isVoice(dataArray,waveDataArray,sr,fs);
  const f0=voiceDetected?estimateF0(waveDataArray,sr):0;

  // ── Heatmap: ALWAYS real-time ──
  const iMap={};let maxI=0.001;
  regionIds.forEach(id=>{
    const cfg=regions[id];let raw;
    if(voiceDetected){
      raw=getMultiBandEnergy(dataArray,sr,fs,cfg.freqs)*cfg.weight;
      if(id==='region-vocalcords'){let t=0;for(let i=0;i<dataArray.length;i++)t+=dataArray[i];t/=dataArray.length*255;raw=Math.max(raw,t*1.3);}
      if(id==='region-diaphragm'||id==='region-dantian'){let t=0;for(let i=0;i<dataArray.length;i++)t+=dataArray[i];t/=dataArray.length*255;raw=Math.max(raw,t*(id==='region-diaphragm'?0.95:0.85));}
      if(id==='region-cricothyroid'&&f0>200)raw*=1+(f0-200)/400;
    }else{raw=0;}
      // Asymmetric: instant rise, slow fade
      if(raw>smoothedI[id]) smoothedI[id]=raw; // snap up instantly
      else smoothedI[id]=smoothedI[id]*0.88+raw*0.12; // gentle fade down
      if(!voiceDetected)smoothedI[id]*=0.94;
    iMap[id]=smoothedI[id];
    if(iMap[id]>maxI)maxI=iMap[id];
  });

  const nF=1/maxI;
  regionIds.forEach(id=>{
    const n=Math.pow(Math.min(1,iMap[id]*nF),0.65);
    const el=document.getElementById(id);
    if(el){el.setAttribute('fill',intensityToColor(n));el.setAttribute('opacity',String(0.35+n*0.65));}
    regions[id]._intensity=n;
  });
  document.getElementById('vocalCordDetail').setAttribute('opacity',String(0.15+(regions['region-vocalcords']._intensity||0)*0.85));
  document.getElementById('dantianDetail').setAttribute('opacity',String(0.1+(regions['region-dantian']._intensity||0)*0.7));

  // ── Accumulate for cumulative (always runs) ──
  if(voiceDetected){
    cumSampleCount++;
    if(f0>0){cumF0Sum+=f0;cumF0Count++;}
    regionIds.forEach(id=>{
      cumIntensities[id]=cumIntensities[id]*CUM_DECAY+(regions[id]._intensity||0)*0.05;
    });
  }

  // ── Metrics (real-time) ──
  const fmts=voiceDetected?findFormants(dataArray,sr,fs):[];
  let rmsV=0;for(let i=0;i<waveDataArray.length;i++){const v=(waveDataArray[i]-128)/128;rmsV+=v*v;}
  rmsV=Math.sqrt(rmsV/waveDataArray.length);
  const spl=rmsV>0?Math.max(0,20*Math.log10(rmsV)+90):0;
  const tE=dataArray.reduce((a,b)=>a+b,0);const fE=fmts.reduce((a,f)=>a+f.amp,0);
  const res=tE>0?Math.min(100,(fE/(tE/dataArray.length))*8):0;
  const air=Math.min(100,(getMultiBandEnergy(dataArray,sr,fs,[[20,200,1.0]])*100+spl)/1.5);

  document.getElementById('metricF0').innerHTML=(voiceDetected&&f0>0?Math.round(f0):'—')+'<span class="metric-unit"> Hz</span>';
  document.getElementById('barF0').style.width=(f0>0?Math.min(100,f0/5):0)+'%';
  document.getElementById('metricSPL').innerHTML=(spl>5?Math.round(spl):'—')+'<span class="metric-unit"> dB</span>';
  document.getElementById('barSPL').style.width=Math.min(100,spl)+'%';
  document.getElementById('metricResonance').innerHTML=(voiceDetected?Math.round(res):'—')+'<span class="metric-unit"> %</span>';
  document.getElementById('barResonance').style.width=res+'%';
  document.getElementById('metricAirflow').innerHTML=(voiceDetected?Math.round(air):'—')+'<span class="metric-unit"> %</span>';
  document.getElementById('barAirflow').style.width=air+'%';
  fmts.sort((a,b)=>a.freq-b.freq);
  ['f1Val','f2Val','f3Val','f4Val'].forEach((el,i)=>{document.getElementById(el).textContent=(fmts[i]?fmts[i].freq:'—')+' Hz';});

  // ── Realtime ranking 2Hz ──
  const now=Date.now();
  if(now-lastRtRank>=500){
    lastRtRank=now;
    const rk=regionIds.map(id=>({id,label:regions[id].label,val:regions[id]._intensity||0})).sort((a,b)=>b.val-a.val);
    let h='';rk.forEach((r,i)=>{const p=Math.round(r.val*100),c=intensityToColor(r.val);
      h+=`<div class="rt-rank-row"><span class="rank-num">${i+1}</span><span class="rank-label">${r.label}</span><div class="rank-bar-bg"><div class="rank-bar" style="width:${p}%;background:${c};"></div></div><span class="rank-pct" style="color:${c};">${p}%</span></div>`;
    });document.getElementById('realtimeRanking').innerHTML=h;
  }

  // ── Cumulative cards: slow update (~1Hz) ──
  if(now-lastCumRender>=1000){
    lastCumRender=now;
    renderCumulative();
  }

  drawSpectrum();drawWaveform();
}

function renderCumulative(){
  const elapsed=Math.round((Date.now()-cumStartTime)/1000);
  document.getElementById('cumTimeBadge').textContent='累积 '+elapsed+'s';

  // Ranking
  let mx=0.001;regionIds.forEach(id=>{if(cumIntensities[id]>mx)mx=cumIntensities[id];});
  const ranked=regionIds.map(id=>({id,label:regions[id].label,val:cumIntensities[id]/mx})).sort((a,b)=>b.val-a.val);
  let rkH='';
  if(cumSampleCount<5){rkH='<div style="color:var(--text-dim);font-size:14px;font-style:italic;">等待声音累积...</div>';}
  else{ranked.forEach((r,i)=>{const p=Math.round(r.val*100),c=intensityToColor(r.val);
    rkH+=`<div class="rank-row"><span class="rank-num">${i+1}</span><span class="rank-label">${r.label}</span><div class="rank-bar-bg"><div class="rank-bar" style="width:${p}%;background:${c};"></div></div><span class="rank-pct" style="color:${c};">${p}%</span></div>`;
  });}
  document.getElementById('cumRanking').innerHTML=rkH;

  // Voice type
  const avgF0=cumF0Count>0?cumF0Sum/cumF0Count:0;
  let vt='—',vd='等待分析...';
  if(avgF0>0&&cumSampleCount>10){
    if(avgF0<130){vt='低沉男声';vd='胸腔共鸣为主，浑厚有力';}
    else if(avgF0<200){vt='中音域';vd='口腔与咽腔均衡，音色饱满';}
    else if(avgF0<300){vt='中高音域';vd='鼻腔与口腔共鸣增多，明亮清澈';}
    else if(avgF0<450){vt='高音域';vd='头腔共鸣显著，环甲肌拉伸声带';}
    else{vt='超高音域';vd='头腔主导，声带高张力状态';}
    vt+=` (~${Math.round(avgF0)} Hz)`;
  }
  document.getElementById('voiceType').textContent=vt;
  document.getElementById('voiceDesc').textContent=vd;

  // Diagnosis
  const tips=cumSampleCount>20?diagnose():[];
  let dH='';
  if(tips.length>0){
    dH='<div class="diag-section">';
    tips.forEach(t=>{const ic=t.type==='good'?'✓':t.type==='warn'?'!':'✗';
      dH+=`<div class="diag-row"><div class="diag-icon ${t.type}">${ic}</div><div class="diag-text">${t.text}</div></div>`;
    });dH+='</div>';
  }
  document.getElementById('diagSection').innerHTML=dH;
}

function drawSpectrum(){
  const cv=document.getElementById('spectrumCanvas'),cx=cv.getContext('2d'),dp=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dp;cv.height=cv.clientHeight*dp;cx.scale(dp,dp);
  const W=cv.clientWidth,H=cv.clientHeight;cx.clearRect(0,0,W,H);
  const bc=80,bW=W/bc-1,step=Math.max(1,Math.floor(freqBinCount/bc));
  for(let i=0;i<bc;i++){let s=0;for(let j=0;j<step;j++)s+=dataArray[i*step+j];const avg=s/step/255,h=avg*H*0.88;
    const g=cx.createLinearGradient(0,H,0,H-h);g.addColorStop(0,'rgba(74,158,255,0.03)');g.addColorStop(0.5,intensityToColor(avg*0.6));g.addColorStop(1,intensityToColor(avg));
    cx.fillStyle=g;cx.beginPath();cx.rect(i*(bW+1),H-h,bW,h);cx.fill();}
  if(voiceDetected&&audioCtx){const bs=audioCtx.sampleRate/analyser.fftSize,vs=85/bs/freqBinCount*bc,ve=4000/bs/freqBinCount*bc;
    cx.strokeStyle='rgba(74,255,139,0.15)';cx.lineWidth=1;cx.setLineDash([4,4]);cx.strokeRect(vs*(bW+1),0,(ve-vs)*(bW+1),H);cx.setLineDash([]);}
}

function drawWaveform(){
  const cv=document.getElementById('waveformCanvas'),cx=cv.getContext('2d'),dp=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dp;cv.height=cv.clientHeight*dp;cx.scale(dp,dp);
  const W=cv.clientWidth,H=cv.clientHeight;cx.clearRect(0,0,W,H);
  cx.strokeStyle='rgba(255,255,255,0.04)';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,H/2);cx.lineTo(W,H/2);cx.stroke();
  const len=analyserWave.fftSize,sl=W/len,col=voiceDetected?'rgba(74,255,139,0.55)':'rgba(255,107,74,0.35)';
  cx.lineWidth=1.5;cx.strokeStyle=col;cx.beginPath();let x=0;
  for(let i=0;i<len;i++){const y=(waveDataArray[i]/128)*H/2;if(i===0)cx.moveTo(x,y);else cx.lineTo(x,y);x+=sl;}cx.stroke();
  cx.lineWidth=4;cx.strokeStyle=voiceDetected?'rgba(74,255,139,0.08)':'rgba(255,107,74,0.06)';cx.beginPath();x=0;
  for(let i=0;i<len;i++){const y=(waveDataArray[i]/128)*H/2;if(i===0)cx.moveTo(x,y);else cx.lineTo(x,y);x+=sl;}cx.stroke();
}

// Tooltip
const tooltip=document.getElementById('tooltip');
document.querySelectorAll('.anatomy-region').forEach(el=>{
  el.addEventListener('mouseenter',()=>{document.getElementById('tooltipTitle').textContent=el.getAttribute('data-name');document.getElementById('tooltipValue').textContent=Math.round((regions[el.id]?._intensity||0)*100)+'%';document.getElementById('tooltipDesc').textContent=el.getAttribute('data-desc');tooltip.classList.add('visible');});
  el.addEventListener('mousemove',e=>{tooltip.style.left=(e.clientX+15)+'px';tooltip.style.top=(e.clientY-10)+'px';});
  el.addEventListener('mouseleave',()=>tooltip.classList.remove('visible'));
});
</script>
